name: Сборка ядра Android — произвольная версия

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Настройки версии ядра ====================
      kernel_version:
        description: "Версия ядра"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      os_patch_level:
        description: "Уровень патчей безопасности (например 2022-01 или lts)"
        required: true
        type: string
        default: "2022-01"

      # ==================== Настройки KernelSU ====================
      kernelsu_variant:
        description: "Вариант KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU(ReSukiSU)
          - XXKSU
          - RKSU
          - KowSU
          - FinaSU (FolkSU)
          - no root manager
        default: BakaSU(ReSukiSU)
      susfs:
        description: "SUSFS mount hiding"
        required: false
        type: choice
        options:
          - "enabled"
          - "disabled"
        default: "enabled"
      nomount:
        description: "NoMount / Mountify mount hiding (metamodules)"
        required: false
        type: choice
        options:
          - "nomount (hookless)"
          - "nomount (ci)"
          - "mountify"
          - "disabled"
        default: "disabled"

      # ==================== Необязательные настройки ====================
      version:
        description: "Своё имя версии (необязательно)"
        required: false
        type: string
      build_time:
        description: "Своё время сборки (необязательно; пусто = текущее UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Настройки параметров ====================
      use_kpm:
        description: "Поддержка KPM (enabled = встроенный KPM KernelSU, patched = внедрение KernelPatch)"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (inject KernelPatch)"
      droidspaces:
        description: "Поддержка контейнеров Droidspaces (5.10–6.6: слот-патч, 6.12: вкл/выкл)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Режим загрузки артефактов сборки"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload all"
        default: "AnyKernel3.zip only"
      droidspaces_ntsync:
        description: "Включить NTSync в контейнерах Droidspaces (требуется Droidspaces)"
        required: false
        type: boolean
        default: false

      # ==================== Функциональные переключатели ====================
      use_zram:
        description: "Включить улучшенный алгоритм ZRAM"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Включить BBG (Baseband Guard, защита от кирпича)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Включить драйвер Re-Kernel"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Применить цепочку исправлений CVE-2026-43499 (rtmutex)"
        required: false
        type: boolean
        default: false
      use_vpnhide:
        description: "Enable VPNHide Next (LSM-based VPN hiding)"
        required: false
        type: boolean
        default: false
      use_usb_arsenal:
        description: "Enable USB-Arsenal gadget support (USB storage/HID/NCM + CD-ROM/DVD patches)"
        required: false
        type: boolean
        default: false
      use_performance:
        description: "Enable performance patches (mem ops, scheduler, fs, wakelock tuning)"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "Включить поддержку OnePlus 8E"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
    steps:
      - name: Получение данных версии
        uses: actions/checkout@v7

      - name: Разбор уровня патчей безопасности
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::Неподдерживаемая версия ядра: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::Данные версии не найдены: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if os_patch_level == "lts":
              kernel_full = data.get("lts")
              if not kernel_full:
                  print(f"::error::{android_version} / {kernel_version}: нет данных LTS")
                  sys.exit(1)
              sub_level = "X"
          else:
              matched = next(
                  (entry for entry in data.get("entries", []) if entry.get("date") == os_patch_level),
                  None,
              )
              if matched is None:
                  print(f"::error::Нет данных версии для {android_version} / {kernel_version} / {os_patch_level}")
                  sys.exit(1)
              kernel_full = matched.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::Некорректные данные: {kernel_full} не относится к {kernel_version}")
                  sys.exit(1)
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")

          print(f"Результат: {android_version} / {kernel_full}, подверсия: {sub_level}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.susfs == 'enabled' }}
      enable_nomount: ${{ inputs.nomount == 'nomount (hookless)' || inputs.nomount == 'nomount (ci)' }}
      nomount_variant: ${{ contains(inputs.nomount, 'ci') && 'ci' || 'hookless' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal }}
      use_performance: ${{ inputs.use_performance }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    if: inputs.kernelsu_variant != 'no root manager'
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide || false }}
 
