name: Экстренная очистка релиза

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Тег релиза (Target Release Tag)'
        required: true
        type: string
      issue_type:
        description: 'Тип проблемы (Issue Type)'
        required: true
        type: choice
        options:
          - Normal
          - Bug
          - Critical
      reference:
        description: 'Ссылка или описание проблемы (необязательно)'
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    # Только владелец репозитория
    if: github.actor == github.repository_owner

    steps:
      # ==================== Проверка существования релиза ====================
      - name: Проверка наличия Release
        run: |
          if ! gh release view "${{ inputs.target_tag }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "::error::Release '${{ inputs.target_tag }}' не существует"
            exit 1
          fi
          echo "✅ Release найден: ${{ inputs.target_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Получение исходной информации о релизе ====================
      - name: Получение исходной информации о релизе
        id: info
        run: |
          gh release view "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --json name,body,isPrerelease > release_info.json

          jq -r '.name' release_info.json > original_title.txt
          jq -r '.body' release_info.json > original_body.txt

          IS_PRERELEASE=$(jq -r '.isPrerelease' release_info.json)
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "📋 Исходный заголовок: $(cat original_title.txt)"
          echo "📋 Pre-release: $IS_PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Обработка типа Normal ====================
      - name: Обработка Normal — пометить как рабочее
        if: inputs.issue_type == 'Normal'
        run: |
          cat > new_body.md << 'EOF'
          > [!TIP]
          > **Эта сборка проверена и работает нормально.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "${{ inputs.reference }}" ]; then
            echo "" >> new_body.md
            echo "**Ссылка/описание**: ${{ inputs.reference }}" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          gh release edit "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --notes-file new_body.md

          echo "✅ Release помечен как Normal"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Обработка типа Bug ====================
      - name: Обработка Bug
        if: inputs.issue_type == 'Bug'
        run: |
          cat > new_body.md << 'EOF'
          > [!WARNING]
          > **В этой сборке есть известные баги, используйте осторожно.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "${{ inputs.reference }}" ]; then
            echo "" >> new_body.md
            echo "**Ссылка/описание**: ${{ inputs.reference }}" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          gh release edit "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --notes-file new_body.md

          echo "✅ Описание Release обновлено (Bug)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Обработка типа Critical ====================
      - name: Обработка Critical — удалить и пересоздать
        if: inputs.issue_type == 'Critical'
        run: |
          ORIGINAL_TITLE=$(cat original_title.txt)

          # Формирование предупреждения
          cat > new_body.md << 'EOF'
          > [!CAUTION]
          > **В этой сборке есть критический баг, приводящий к зависанию; все вложения удалены!**
          >
          > **Не используйте эту сборку, дождитесь исправления.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "${{ inputs.reference }}" ]; then
            echo "" >> new_body.md
            echo "**Ссылка/описание**: ${{ inputs.reference }}" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          # Удаление Release (Git Tag сохраняется)
          echo "🗑️ Удаляем исходный Release..."
          gh release delete "${{ inputs.target_tag }}" --repo ${{ github.repository }} --yes

          # Определение флага prerelease
          PRERELEASE_FLAG=""
          if [ "${{ steps.info.outputs.is_prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Пересоздание Release (без файлов)
          echo "🔄 Пересоздаём Release..."
          gh release create "${{ inputs.target_tag }}" --repo ${{ github.repository }} \
            --title "$ORIGINAL_TITLE" \
            --notes-file new_body.md \
            $PRERELEASE_FLAG

          echo "✅ Все вложения удалены, Release пересоздан (Critical)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== Уведомление о завершении ====================
      - name: Готово
        run: |
          echo "=========================================="
          echo "🎯 Целевой тег: ${{ inputs.target_tag }}"
          echo "📌 Тип проблемы: ${{ inputs.issue_type }}"
          echo "📝 Ссылка/описание: ${{ inputs.reference || 'нет' }}"
          echo "=========================================="
          echo "✅ Экстренная очистка завершена!"
