name: Sultan
permissions:
  contents: write # Allow writing to repository contents (for pushing tags)
  actions: write # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      ksu_variant:
        description: "KernelSU variant (ReSukiSU/Official/SukiSU/Next). Only 'ReSukiSU' is a tested combination against this device tree (it implements the SUSFS bridge natively in kernel/feature/sucompat.c). Other variants may build but are not confirmed working here."
        required: false
        type: string
        default: "ReSukiSU"
      use_bbg:
        description: "Enable BBG (Baseband Guard, anti-brick)"
        required: false
        type: boolean
        default: true
      droidspaces_ntsync:
        description: "Enable NTSync support inside the Droidspaces container (requires Droidspaces)"
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["wksu-susfs"]

    steps:
      #- name: Maximize Build Space
      #  uses: AdityaGarg8/remove-unwanted-software@v5
      #  with:
      #    remove-dotnet: 'true'          # Frees ~2 GB
      #    remove-android: 'true'         # Frees ~9 GB
      #    remove-haskell: 'true'         # Frees ~5.2 GB
      #    remove-codeql: 'true'          # Frees ~5.4 GB
      #    remove-docker-images: 'true'   # Frees ~3.2 GB
      #    remove-large-packages: 'true'  # Frees ~3.1 GB
      #    remove-swapfile: 'true'        # Frees ~4 GB
      #    remove-cached-tools: 'false'   # Avoid unless confirmed safe
      #    verbose: 'true'                # Enable detailed logging

      - name: Checkout repository
        # Provides the hand-built backport patches under .github/patches/sultan/
        # NOTE: must run BEFORE extracting the toolchain -- actions/checkout does a
        # hard clean (clean: true) that wipes untracked files like the extracted
        # gcc-14.2.0-nolibc/ directory if the toolchain lands first.
        uses: actions/checkout@v7

      - name: Set CONFIG Environment Variable
        run: |
          # Directory name of the cloned kernel tree. zumapro (and the older
          # gs201/zuma) use kerneltoast's tensynos tree; tegu (Pixel 9a) is built
          # from etnperlong's Sultan-based tegu port (6.1.157).
          if [ "${{ inputs.codename }}" == "tegu" ]; then
            CONFIG="android_kernel_google_tegu"
          else
            CONFIG="android_kernel_google_tensynos"
          fi

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

      - name: Set DEFCONFIG Environment Variable
        run: |
          # Defconfig filename. The tegu tree (etnperlong) keeps Sultan's
          # zumapro_defconfig name -- there is no tegu_defconfig.
          if [ "${{ inputs.codename }}" == "tegu" ]; then
            DEFCONFIG="zumapro_defconfig"
          else
            DEFCONFIG="${{ inputs.codename }}_defconfig"
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "DEFCONFIG set to: $DEFCONFIG"

      - name: Download and extract GCC 14.2.0 toolchain
        run: |
          echo "Downloading GCC 14.2.0 cross-compiler toolchain..."
          wget https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .gz file..."
          gunzip x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .tar file..."
          tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar
          echo "GCC 14.2.0 toolchain extracted successfully"

      - name: Determine KernelSU branch
        if: contains(matrix.features, 'wksu')
        run: |
          variant_input="${{ inputs.ksu_variant }}"

          LEGACY_SUKISU_CONFIG=""
          case "$variant_input" in
            SukiSU\(*\)) LEGACY_SUKISU_CONFIG="$GITHUB_WORKSPACE/config/${variant_input}.config" ;;
          esac
          if [ -n "$LEGACY_SUKISU_CONFIG" ] && [ ! -f "$LEGACY_SUKISU_CONFIG" ]; then
            echo "Fixed-commit config for $variant_input not found: $LEGACY_SUKISU_CONFIG" >&2
            exit 1
          fi

          case "$variant_input" in
            "Official"|"ReSukiSU")
              BRANCH="-s main"
              ;;
            "SukiSU")
              BRANCH="-s builtin"
              ;;
            "Next")
              BRANCH="-s 293ca016cf7196c2e96403a929ea3f464fd3568b"
              ;;
            *)
              if [ -z "$LEGACY_SUKISU_CONFIG" ]; then
                echo "Unknown variant: $variant_input" >&2
                exit 1
              fi
              SUKISU_FIXED_COMMIT=$(grep "^sukisu=" "$LEGACY_SUKISU_CONFIG" | cut -d'=' -f2-)
              if [ -z "$SUKISU_FIXED_COMMIT" ]; then
                echo "No pinned SukiSU commit configured in $LEGACY_SUKISU_CONFIG" >&2
                exit 1
              fi
              BRANCH="-s $SUKISU_FIXED_COMMIT"
              ;;
          esac

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU branch: $BRANCH"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."

          # tegu has no dedicated sultan-tegu branch on TheWildJames/AnyKernel3;
          # sultan-zumapro already implements the exact boot + vendor_kernel_boot
          # flash scheme, and we sed its anykernel.sh to the tegu device values
          # in a dedicated step below.
          ANYKERNEL_BRANCH="sultan-${{ inputs.codename }}"
          if [ "${{ inputs.codename }}" == "tegu" ]; then
            ANYKERNEL_BRANCH="sultan-zumapro"
          fi

          # Debug print the branches
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"

          # Clone repositories using the branch names
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/TheWildJames/kernel_patches.git
          if [ "${{ inputs.codename }}" == "tegu" ]; then
            git clone https://github.com/etnperlong/android_kernel_google_tegu --depth=1
          else
            git clone https://github.com/kerneltoast/android_kernel_google_tensynos --depth=1
          fi
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          cd susfs4ksu
          git checkout ef16cbce5c5195988b9b630de85466148cbbcdef

      - name: Patch AnyKernel3 anykernel.sh for tegu
        if: inputs.codename == 'tegu'
        run: |
          echo "Patching AnyKernel3 anykernel.sh for tegu (Pixel 9a)..."
          cd AnyKernel3

          # sultan-zumapro's anykernel.sh allows only caiman/komodo/tokay/comet
          # and supported.versions=16. The Pixel 9a reports ro.product.device=tegu
          # and runs Android 17 (SP 2026-07), so both checks would abort the flash
          # ("Unsupported device/Android version"). Match the reference Optimistic
          # release: device.name1=tegu, versions=17, patchlevels open-ended to 2026-09.
          sed -i 's/^device\.name1=.*/device.name1=tegu/; s/^device\.name2=.*/device.name2=/; s/^device\.name3=.*/device.name3=/; s/^device\.name4=.*/device.name4=/; s/^device\.name5=.*/device.name5=/' anykernel.sh
          sed -i 's/^supported\.versions=.*/supported.versions=17/' anykernel.sh
          sed -i 's/^supported\.patchlevels=.*/supported.patchlevels=- 2026-09/' anykernel.sh

          echo "Patched anykernel.sh:"
          grep -E 'device\.name|supported\.' anykernel.sh

      - name: Add KernelSU
        if: contains(matrix.features, 'wksu')
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          case "${{ inputs.ksu_variant }}" in
            "ReSukiSU")
              echo "Adding ReSukiSU (primary, tested combination)..."
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash $BRANCH
              ;;
            "Next")
              echo "Adding KernelSU-Next (SUSFS bridge via ksun compat patch below)..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash $BRANCH
              ;;
            "Official")
              echo "Adding official KernelSU (untested combination on this device tree)..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash $BRANCH
              ;;
            "SukiSU")
              echo "Adding SukiSU (untested combination on this device tree)..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
            *)
              echo "Adding ${{ inputs.ksu_variant }} (legacy pinned SukiSU commit)..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
          esac

      - name: Apply ReSukiSU static symbol exports
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          # ReSukiSU's static_export_check.mk hard-fails the build when
          # CONFIG_KALLSYMS_ALL is off (Sultan disables it) unless these symbols
          # are made non-static in security/selinux/selinuxfs.c:
          #   - write_op            (note: Sultan has 'static ssize_t (*const write_op[])',
          #     the extra 'const' slipped past ReSukiSU's exact grep and was wrongly
          #     reported as exported; make it actually non-static too)
          #   - sel_handle_status_ops
          patch -p1 --fuzz=0 < $GITHUB_WORKSPACE/.github/patches/sultan/sultan-resukisu-selinux-export.patch

      - name: Apply SUSFS Kernel Patches
        if: contains(matrix.features, 'susfs')
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          # New SUSFS source files are copied in, the hook modifications come from
          # the hand-built backport patch (Sultan 6.1.145 specific, fuzz=0 clean):
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          patch -p1 --fuzz=0 < $GITHUB_WORKSPACE/.github/patches/sultan/sultan-susfs-a14-6.1.patch

          # KernelSU-Next needs the ksun compat bridge for SUSFS; ReSukiSU provides
          # the same bridge natively (kernel/feature/sucompat.c) so nothing is
          # needed for it. Other variants are untested on this device tree.
          if [ "${{ inputs.ksu_variant }}" == "Next" ] && [ -d "KernelSU-Next" ]; then
            echo "Applying ksun SUSFS compat patch for KernelSU-Next..."
            cd KernelSU-Next
            cp ${{ github.workspace }}/kernel_patches/wild/archived/ksun-293ca01-susfs-v2.1.0-a14-6.1-ef16cbce.patch ./
            patch -p1 --fuzz=0 < ksun-293ca01-susfs-v2.1.0-a14-6.1-ef16cbce.patch
            cd ..
          fi

      - name: Apply Droidspaces Patches
        if: contains(matrix.features, 'susfs')
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          # Enables SYSVIPC / POSIX_MQUEUE / namespace / devtmpfs options and moves
          # sysvsem/sysvshm out of the middle of task_struct (ABI-safe layout so
          # stock vendor modules keep working), plus the defconfig fragment.
          #
          # The Sultan 6.1.145 patch appends the fragment to gs201/zuma/zumapro
          # defconfigs; the etnperlong tegu tree only carries zumapro_defconfig
          # (gs201/zuma hunks fail with fuzz=0), so use the tegu-specific variant
          # there (sched.h + zumapro_defconfig only).
          if [ "${{ inputs.codename }}" == "tegu" ]; then
            patch -p1 --fuzz=0 < $GITHUB_WORKSPACE/.github/patches/sultan/sultan-droidspaces-a14-6.1-tegu.patch
          else
            patch -p1 --fuzz=0 < $GITHUB_WORKSPACE/.github/patches/sultan/sultan-droidspaces-a14-6.1.patch
          fi

      - name: Configure KernelSU
        if: contains(matrix.features, 'wksu')
        run: |
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> ./arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/$DEFCONFIG
          if [[ "${{ matrix.features }}" == *"susfs"* ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/$DEFCONFIG
          else
            echo "CONFIG_KSU_SUSFS=n" >> ./arch/arm64/configs/$DEFCONFIG
          fi

      - name: Configure Mountify Support
        if: matrix.features == 'wksu-susfs'
        run: |
          cd "$CONFIG"
          # Mountify Support
          echo "# Mountify Support" >> ./arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/$DEFCONFIG

      - name: Run sed Commands
        if: matrix.features == 'wksu-susfs'
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Running sed commands..."

          # Sultan uses CONFIG_LOCALVERSION="-Sultan", the Optimistic tegu tree
          # uses "-Optimistic"; normalize whatever is there to our tag.
          sed -i 's/^CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-Sultan-SUSFS"/' ./arch/arm64/configs/$DEFCONFIG

          sed -i '/echo "+"$/d' scripts/setlocalversion

          # KernelSU/SUSFS code breaks the arm64 LTO link: with LTO (GCC or Clang)
          # the added drivers produce GOT/PLT entries and an undefined reference to
          # task_stack_page (from ksu_handle_execve). KernelSU recommends disabling
          # LTO for custom kernels, so flip any stock LTO to LTO_NONE. The tegu
          # defconfig ships CONFIG_LTO_CLANG_THIN=y, so clear all three variants.
          sed -i '/^CONFIG_LTO=y$/d; /^CONFIG_LTO_GCC=y$/d; /^CONFIG_LTO_CLANG=y$/d; /^CONFIG_LTO_CLANG_THIN=y$/d' ./arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/$DEFCONFIG

          # With LTO disabled, GCC 14.2.0 now compiles gsa_core.c with the default
          # -Werror active and proves (via inlining of gsa_kdn_program_key and
          # gsa_sjtag_*) that dst_buf can be NULL at the memcpy() in send_kdn_cmd()
          # and send_sjtag_data_cmd() when the callers pass (NULL, 0). The code is
          # actually safe (when cb > 0, dst_buf_sz >= cb > 0, so the earlier
          # dst_buf_sz guard already rejected NULL), so guard the copy the same way
          # the driver guards its own inputs. This mirrors upstream GKI behaviour
          # where LTO defers the check; with LTO_NONE it fails the build otherwise.
          perl -0pi -e 's/\tif \(cb\) \{\n\t\t\/\* copy data to destination buffer \*\//\tif (cb \&\& dst_buf) {\n\t\t\/\* copy data to destination buffer \*\//g' google-modules/soc/gs/drivers/soc/google/gsa/gsa_core.c

          # ReSukiSU kernel/feature/adb_root.c calls current_user_stack_pointer()
          # (via user_stack_pointer(current_pt_regs()) -> task_pt_regs() ->
          # task_stack_page()) but does NOT include <linux/sched/task_stack.h>.
          # On stock GKI the declaration leaks in transitively, but in the Sultan
          # tree it does not, so GCC 14 emits a call to an external task_stack_page
          # and vmlinux fails to link with an undefined reference (plus GOT/PLT
          # checks). sucompat.c and syscall_hook_manager.c already include this
          # header; add the same include to adb_root.c after <asm/ptrace.h>.
          sed -i '1a #include <linux/sched/task_stack.h>' ./drivers/kernelsu/feature/adb_root.c

          # The tegu tree (6.1.157) backports the include/linux/minmax.h MIN/MAX
          # macros, while lib/lz4 (lz4 1.9.x, obj-y for both files) and the vendor
          # google-modules/* drivers redefine MIN/MAX locally -> GCC -Werror "MIN/MAX
          # redefined". Clang does not warn on macro redefinition by default, which is
          # why the Optimistic (Clang 21) build never hit this. The fix is compile-time
          # only: #undef before each local define, which yields identical machine code
          # (upstream lib/lz4 lz4.c already does exactly this). No runtime behaviour
          # change, no zram involvement. Runs for every codename; the zumapro 6.1.145
          # tree simply has no files that redefine MIN/MAX.
          while read -r f; do
            perl -0pi -e 's/(^|\n)#define (MIN|MAX)\(/${1}#undef $2\n#define $2(/g' "$f"
          done < <(git grep -lE '^[[:space:]]*#define (MIN|MAX)\(' -- '*.c' '*.h' 2>/dev/null || true)

          # The tegu tree (6.1.157) defaults CONFIG_WERROR=y (init/Kconfig:
          # "default y"), and GCC flags macro redefinitions (MIN/MAX, DWC3_LLUCTL,
          # ...) in lib/lz4 and the vendor google-modules/* as errors, while Clang
          # does not warn on macro redefinition at all (why the Optimistic build is
          # clean). Disabling WERROR only relaxes build strictness -- zero effect on
          # generated code or boot. The zumapro 6.1.145 tree stays on -Werror.
          if [ "${{ inputs.codename }}" == "tegu" ]; then
            echo "CONFIG_WERROR=n" >> ./arch/arm64/configs/$DEFCONFIG
          fi

      - name: Add BBG (Baseband Guard) anti-brick patch
        if: inputs.use_bbg
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          # Baseband Guard blocks writes to baseband partitions unless the target
          # is allowlisted. vc-teahouse's setup.sh supports non-GKI trees (security/
          # + include/ at the repo root), so it works directly on the Sultan source.
          # It clones the driver, symlinks security/baseband-guard, and wires
          # obj-$(CONFIG_BBG) + the Kconfig source into security/.
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

          echo "CONFIG_BBG=y" >> ./arch/arm64/configs/$DEFCONFIG

          # Sultan's security/Kconfig indents "help" with a tab, unlike the GKI tree,
          # so the range terminator here is ^[[:space:]]*help$ (would be ^help$ on GKI).
          sed -i '/^config LSM$/,/^[[:space:]]*help$/{ /^[[:space:]]*default/ s/selinux/selinux,baseband_guard/ }' security/Kconfig

      - name: Inject NTSync kernel driver
        if: inputs.droidspaces_ntsync
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          # NTSync (NT synchronization primitive emulation for running Windows apps
          # via Wine/Proton inside the Droidspaces container). Same patches and
          # config the GKI path uses for android14/6.1; both apply cleanly to the
          # Sultan tree (verified, fuzz=0).
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/ntsync_base.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/ntsync_compat_android14-6.1.patch"

          patch -p1 --fuzz=0 < "ntsync_base.patch"
          patch -p1 --fuzz=0 < "ntsync_compat_android14-6.1.patch"

          # The compat patch registers ntsync as a tristate defaulting to m, but the
          # build only flashes Image.lz4, so force it built-in.
          sed -i '/CONFIG_NTSYNC is not set/d' ./arch/arm64/configs/$DEFCONFIG
          if ! grep -q "^CONFIG_NTSYNC=y" ./arch/arm64/configs/$DEFCONFIG; then
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/$DEFCONFIG
            echo "CONFIG_NTSYNC enabled"
          else
            echo "CONFIG_NTSYNC already enabled"
          fi

      - name: Build the Kernel
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc -j$(nproc --all) $DEFCONFIG
          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc LOCALVERSION_AUTO=0 -j$(nproc --all)

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          if [ "${{ inputs.codename }}" == "gs201" ]; then
            cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
            #cp ./out/google-devices/gs201/dts/dtbo.img ../AnyKernel3/dtbo.img
          elif [ "${{ inputs.codename }}" == "zuma" ]; then
            cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zumapro" ] || [ "${{ inputs.codename }}" == "tegu" ]; then
            cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3

          # Zip the files in the AnyKernel3 directory with a new naming convention
          ZIP_NAME="${{ inputs.codename }}-a${{ inputs.kernel_version }}-${{ matrix.features }}-${{ inputs.ksu_variant }}-anykernel3.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.features }}-${{ inputs.ksu_variant }}
          path: |
            *.zip

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej

          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"

            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"

            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.features }}.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            rej-${{ inputs.codename }}-${{ matrix.features }}.zip
